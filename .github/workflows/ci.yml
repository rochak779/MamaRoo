name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx supabase start
      # db reset (not migration up) so the placeholder seed configured in
      # supabase/config.toml's [db.seed] also applies -- `supabase db query --file`
      # can't run a multi-statement seed file ("cannot insert multiple commands into
      # a prepared statement"), but db reset's own seed loader can.
      - run: npx supabase db reset
      - run: npx supabase gen types typescript --local | node scripts/gen-db-types.mjs > /tmp/types.ts && diff /tmp/types.ts lib/supabase/database.types.ts
      - name: Export local Supabase credentials for the RLS suite and the app
        run: |
          npx supabase status -o json > /tmp/supabase-status.json
          node scripts/export-supabase-status.mjs /tmp/supabase-status.json >> "$GITHUB_ENV"
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - name: Run e2e against the full app (the launch gate is a production-only concern)
        run: npm run test:e2e
        env:
          APP_LAUNCHED: "true"
      # Kept permanently (not just for this debug session): a red e2e run with
      # no trace/screenshot to look at is much slower to diagnose than one
      # with this artifact attached.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
