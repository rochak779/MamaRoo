<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>body{margin:0;background:linear-gradient(180deg, #F7EEE3, #F7DFD9);}</style>
</helmet>
<div style="position:relative;width:375px;min-height:812px;margin:0 auto;background:linear-gradient(180deg, #F7EEE3, #F7DFD9);font-family:'Mukta',sans-serif;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:72px 20px 32px 20px;overflow:hidden;">

  <img src="assets/mamaroo-logo.svg" alt="MamaRoo logo" style="position:relative;width:120px;height:auto;"/>

  <h1 style="position:relative;font-family:'Poppins',sans-serif;font-weight:500;font-size:28px;line-height:36px;color:#670035;text-align:center;margin:32px 0 12px 0;">Welcome to MamaRoo</h1>

  <div style="position:relative;display:flex;flex-direction:column;gap:12px;max-width:320px;">
    <p style="font-size:16px;line-height:24px;color:rgba(103,0,53,0.85);text-align:center;margin:0;">Your pregnancy journey, made a little easier.</p>
    <p style="font-size:16px;line-height:24px;color:rgba(103,0,53,0.85);text-align:center;margin:0;">Follow your baby's growth, understand the changes in your body, and keep everything important in one calm place.</p>
    <p style="font-size:16px;line-height:24px;color:rgba(103,0,53,0.85);text-align:center;margin:0;">You do not have to figure it all out today. We will take it one day at a time, together.</p>
  </div>

  <div style="flex:1;"></div>

  <div style="position:relative;width:100%;display:flex;flex-direction:column;gap:16px;">
    <button style="width:100%;box-sizing:border-box;padding:16px;border-radius:999px;border:none;background:#D63A29;color:#FFFFFF;font-family:'Mukta',sans-serif;font-weight:500;font-size:16px;line-height:20px;cursor:pointer;">Start my pregnancy journey</button>
    <button style="width:100%;box-sizing:border-box;padding:16px;border-radius:999px;background:#FFFFFF;border:1.5px solid #D63A29;color:#D63A29;font-family:'Mukta',sans-serif;font-weight:500;font-size:16px;line-height:20px;cursor:pointer;">I already have an account</button>
  </div>

</div>

</x-dc>
</body>
</html>
