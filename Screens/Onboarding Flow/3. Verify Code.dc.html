<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>body{margin:0;background:linear-gradient(180deg, #F7EEE3, #F7DFD9);}</style>
</helmet>
<div style="width:375px;min-height:812px;margin:0 auto;background:linear-gradient(180deg, #F7EEE3, #F7DFD9);font-family:'Mukta',sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:64px 20px 32px 20px;">
  <h1 style="font-family:'Poppins',sans-serif;font-weight:500;font-size:24px;line-height:32px;color:#670035;margin:0 0 8px 0;">Enter the code</h1>
  <p style="font-size:16px;line-height:24px;color:rgba(103,0,53,0.85);margin:0 0 32px 0;">Sent to +91 98765 43210. <a href="#" style="color:#D63A29;text-decoration:none;font-weight:500;">Change number</a></p>

  <div style="display:flex;gap:8px;justify-content:space-between;">
    <sc-for list="{{ boxes }}" as="box" hint-placeholder-count="6">
      <input
        type="tel"
        inputmode="numeric"
        maxlength="1"
        value="{{ box.value }}"
        onChange="{{ box.onChange }}"
        style="{{ box.style }}"
      />
    </sc-for>
  </div>

  <p style="font-size:13px;line-height:18px;color:rgba(103,0,53,0.85);margin:16px 0 0 0;">{{ timerLine }}</p>

  <div style="flex:1;"></div>

  <button style="{{ buttonStyle }}" disabled="{{ buttonDisabled }}">Verify and continue</button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { digits: ['', '', '', '', '', ''], seconds: 28 };

  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState((s) => ({ seconds: Math.max(0, s.seconds - 1) }));
    }, 1000);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
  }

  boxStyle(filled) {
    return {
      width: '48px',
      height: '56px',
      textAlign: 'center',
      boxSizing: 'border-box',
      borderRadius: '12px',
      background: '#FFFFFF',
      border: filled ? '2px solid #D63A29' : '1px solid rgba(103,0,53,0.18)',
      fontFamily: 'Mukta, sans-serif',
      fontSize: '20px',
      fontWeight: 500,
      color: '#670035',
      outline: 'none',
    };
  }

  renderVals() {
    const digits = this.state.digits;
    const boxes = digits.map((value, i) => ({
      value,
      style: this.boxStyle(!!value),
      onChange: (e) => {
        const v = e.target.value.replace(/\D/g, '').slice(-1);
        const next = digits.slice();
        next[i] = v;
        this.setState({ digits: next });
      },
    }));
    const complete = digits.every((d) => d !== '');
    const m = Math.floor(this.state.seconds / 60);
    const s = String(this.state.seconds % 60).padStart(2, '0');
    return {
      boxes,
      timerLine: this.state.seconds > 0
        ? `You can ask for a new code in ${m}:${s}`
        : 'You can ask for a new code now.',
      buttonDisabled: !complete,
      buttonStyle: {
        width: '100%',
        boxSizing: 'border-box',
        padding: '16px',
        borderRadius: '999px',
        border: 'none',
        background: complete ? '#D63A29' : '#F6C7B9',
        color: complete ? '#FFFFFF' : 'rgba(103,0,53,0.55)',
        fontFamily: 'Mukta, sans-serif',
        fontWeight: 500,
        fontSize: '16px',
        lineHeight: '20px',
        cursor: complete ? 'pointer' : 'default',
      },
    };
  }
}

</script>
</body>
</html>
