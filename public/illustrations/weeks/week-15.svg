<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
  <radialGradient id="uterus"><stop stop-color="#ffdeda"/><stop offset="1" stop-color="#ff9b92"/></radialGradient>
  <radialGradient id="cavity"><stop stop-color="#b82f31"/><stop offset=".7" stop-color="#86191c"/><stop offset="1" stop-color="#5d1115"/></radialGradient>
  <radialGradient id="sac"><stop stop-color="#fffaf7"/><stop offset=".65" stop-color="#ffe1d8"/><stop offset="1" stop-color="#ee988c"/></radialGradient>
  <radialGradient id="fetus"><stop stop-color="#fff3ea"/><stop offset=".48" stop-color="#ffc0af"/><stop offset="1" stop-color="#d85f57"/></radialGradient>
  <linearGradient id="placenta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ef766c"/><stop offset="1" stop-color="#c94744"/></linearGradient>
  <radialGradient id="yolk"><stop stop-color="#fff2bd"/><stop offset=".55" stop-color="#ffca6b"/><stop offset="1" stop-color="#e99b43"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1200" height="1200" fill="#fff"/>
<ellipse cx="600" cy="1082" rx="330" ry="28" fill="#e7aaa2" opacity=".22" filter="url(#blur)"/>

<!-- uterus -->
<circle cx="600" cy="600" r="500" fill="url(#uterus)"/>
<circle cx="600" cy="600" r="468" fill="#ff766e"/>
<circle cx="600" cy="600" r="445" fill="#ffb7ae"/>
<circle cx="600" cy="600" r="425" fill="url(#cavity)"/>
<circle cx="600" cy="600" r="398" fill="#741619" opacity=".72"/>

<!-- decidual/endometrial tissue -->
<path d="M100 310 C205 235 335 258 414 366 C486 465 463 650 538 805
C600 933 755 958 892 873 C986 814 1042 726 1100 625 L1100 1100 L100 1100Z"
fill="url(#placenta)" opacity=".96"/>
<path d="M120 315 C220 252 330 280 401 379 C475 484 466 651 541 805
C606 918 751 941 884 865 C975 815 1034 732 1080 625"
fill="none" stroke="#ffbbae" stroke-width="28" opacity=".7"/>

<!-- tissue cells -->
<g fill="#ed746a" stroke="#d45851" stroke-width="4">
<circle cx="165" cy="350" r="39"/><circle cx="225" cy="305" r="42"/><circle cx="290" cy="320" r="40"/>
<circle cx="345" cy="370" r="42"/><circle cx="380" cy="430" r="40"/><circle cx="395" cy="495" r="41"/>
<circle cx="395" cy="560" r="40"/><circle cx="405" cy="625" r="41"/><circle cx="438" cy="690" r="42"/>
<circle cx="485" cy="755" r="43"/><circle cx="545" cy="805" r="44"/><circle cx="615" cy="835" r="44"/>
<circle cx="690" cy="845" r="43"/><circle cx="765" cy="830" r="42"/><circle cx="835" cy="800" r="41"/>
<circle cx="900" cy="760" r="40"/><circle cx="960" cy="705" r="39"/>
<circle cx="205" cy="405" r="40"/><circle cx="270" cy="385" r="41"/><circle cx="330" cy="435" r="40"/>
<circle cx="350" cy="505" r="40"/><circle cx="350" cy="575" r="40"/><circle cx="375" cy="645" r="41"/>
<circle cx="420" cy="715" r="42"/><circle cx="475" cy="780" r="42"/><circle cx="545" cy="830" r="42"/>
<circle cx="625" cy="865" r="43"/><circle cx="705" cy="865" r="42"/><circle cx="785" cy="845" r="41"/>
</g>

<!-- gestational sac -->
<path d="M382 242 C510 152 722 164 844 270 C952 364 971 518 916 672
C866 815 750 902 602 912 C451 913 338 806 314 650
C290 498 318 349 382 242Z"
fill="url(#sac)" stroke="#ffe4db" stroke-width="12"/>
<ellipse cx="606" cy="565" rx="286" ry="348" fill="#fffaf7" opacity=".25"/>

<!-- placenta and villi -->
<path d="M790 245 C890 305 940 420 940 535 C940 653 902 754 824 820
C791 756 753 687 724 620 C700 548 726 362 790 245Z"
fill="#df5f59" opacity=".95"/>
<g fill="none" stroke="#ffaaa0" stroke-width="17" stroke-linecap="round">
<path d="M820 315 Q885 270 920 225"/><path d="M855 370 Q925 330 955 285"/>
<path d="M875 435 Q940 405 970 365"/><path d="M888 505 Q950 490 982 455"/>
<path d="M885 580 Q950 580 980 555"/><path d="M860 650 Q920 675 950 695"/>
<path d="M830 720 Q875 745 900 775"/>
</g>

<!-- yolk sac, now smaller relative to fetus -->
<ellipse cx="410" cy="737" rx="42" ry="38" fill="url(#yolk)" stroke="#ffe3a4" stroke-width="7"/>
<ellipse cx="400" cy="724" rx="13" ry="9" fill="#fff7d5" opacity=".75"/>

<!-- umbilical cord -->
<path d="M670 800 C716 809 752 826 780 849 C808 874 832 897 858 914"
fill="none" stroke="#ed9284" stroke-width="22" stroke-linecap="round"/>
<path d="M670 798 C715 807 750 824 777 847 C805 872 829 895 855 912"
fill="none" stroke="#ffd9cf" stroke-width="7" stroke-linecap="round"/>

<!-- Week 15 fetus: longer, more fetal proportions, clear limbs and hands -->
<g>
<ellipse cx="600" cy="585" rx="278" ry="352" fill="#ffb8ac" opacity=".13" filter="url(#soft)"/>

<!-- torso -->
<path d="M576 451 C536 487 522 546 529 615 C536 678 552 731 568 780
C582 823 584 871 608 908 C639 954 710 964 766 922
C816 885 827 830 812 769 C798 708 770 649 766 587
C762 524 734 480 687 451 C647 427 605 431 576 451Z"
fill="url(#fetus)" stroke="#ffe3d8" stroke-width="10"/>

<!-- head -->
<path d="M520 260 C458 264 410 305 399 364 C389 425 414 481 465 510
C515 539 565 511 582 459 C600 407 593 336 556 293 C545 278 533 267 520 260Z"
fill="#ffebe0" stroke="#ffe5db" stroke-width="8"/>

<!-- neck -->
<path d="M551 485 Q574 510 605 525" fill="none" stroke="#eb9183" stroke-width="25" stroke-linecap="round"/>

<!-- ear -->
<ellipse cx="559" cy="410" rx="16" ry="24" fill="#df756d"/>
<path d="M557 401 Q571 413 557 426" fill="none" stroke="#ffd2c7" stroke-width="6" stroke-linecap="round"/>

<!-- face/profile -->
<path d="M438 323 Q468 288 512 282 Q558 282 578 320
Q595 350 587 381 L603 397 L586 415 Q583 457 547 479"
fill="none" stroke="#d9635b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="528" cy="347" r="15" fill="#6e1418"/>
<circle cx="533" cy="342" r="5" fill="#fff"/>
<path d="M537 433 Q554 443 570 433" fill="none" stroke="#d55e57" stroke-width="7" stroke-linecap="round"/>

<!-- subtle facial contour -->
<path d="M468 463 Q509 491 549 474" fill="none" stroke="#e17b70" stroke-width="8" opacity=".7"/>

<!-- chest and heart -->
<path d="M617 528 C600 503 570 520 578 550 C585 576 612 594 631 607
C649 589 676 566 669 539 C663 514 634 511 617 528Z" fill="#d8534f"/>
<path d="M631 545 Q647 555 652 571" fill="none" stroke="#f28a80" stroke-width="7" stroke-linecap="round"/>

<!-- arms -->
<path d="M598 571 Q557 581 533 619 Q518 645 525 672"
fill="none" stroke="#e98d80" stroke-width="28" stroke-linecap="round"/>
<path d="M525 672 l-23 18 M525 672 l-9 24 M525 672 l5 24 M525 672 l17 20"
fill="none" stroke="#d5665e" stroke-width="8" stroke-linecap="round"/>

<path d="M706 579 Q753 592 779 630 Q795 657 789 686"
fill="none" stroke="#e98d80" stroke-width="28" stroke-linecap="round"/>
<path d="M789 686 l20 17 M789 686 l9 24 M789 686 l-2 24 M789 686 l-17 18"
fill="none" stroke="#d5665e" stroke-width="8" stroke-linecap="round"/>

<!-- legs -->
<path d="M611 775 Q590 816 603 854 Q611 881 634 910"
fill="none" stroke="#e88d80" stroke-width="30" stroke-linecap="round"/>
<path d="M697 777 Q724 816 725 854 Q724 882 749 912"
fill="none" stroke="#e88d80" stroke-width="29" stroke-linecap="round"/>

<!-- feet and toes -->
<path d="M634 910 q-21 14 -33 25 M634 910 q-5 18 -15 29 M634 910 q11 14 22 21"
fill="none" stroke="#d5665e" stroke-width="8" stroke-linecap="round"/>
<path d="M749 912 q-20 14 -31 25 M749 912 q-4 18 -14 29 M749 912 q11 14 22 21"
fill="none" stroke="#d5665e" stroke-width="8" stroke-linecap="round"/>

<!-- abdomen contour -->
<path d="M616 606 Q684 634 723 700 Q746 739 753 789"
fill="none" stroke="#d96b62" stroke-width="14" opacity=".68"/>

<!-- highlights -->
<path d="M426 326 Q458 289 501 280" fill="none" stroke="#fffaf6" stroke-width="13" stroke-linecap="round" opacity=".8"/>
<path d="M619 861 Q657 915 714 926" fill="none" stroke="#ffddd2" stroke-width="9" stroke-linecap="round" opacity=".65"/>
</g>

<!-- fluid particles -->
<g fill="#f99d92" stroke="#ffded7" stroke-width="3">
<circle cx="390" cy="330" r="9"/><circle cx="458" cy="267" r="8"/><circle cx="780" cy="280" r="9"/>
<circle cx="860" cy="390" r="9"/><circle cx="900" cy="545" r="8"/><circle cx="853" cy="780" r="8"/>
<circle cx="437" cy="818" r="7"/>
</g>
</svg>