<ellipse cx="606" cy="560" rx="284" ry="328" fill="#fffaf7" opacity=".22"/>

<!-- placenta -->
<path d="M790 258 C865 304 911 384 919 479 C929 602 897 709 823 794
C791 753 760 705 730 644 C705 592 709 403 790 258Z" fill="#d95852"/>
<g fill="none" stroke="#ffaaa0" stroke-width="15" stroke-linecap="round">
<path d="M815 320 Q865 278 903 236"/><path d="M844 371 Q905 338 936 298"/>
<path d="M864 429 Q925 408 953 372"/><path d="M874 490 Q934 482 965 452"/>
<path d="M875 552 Q931 558 962 539"/><path d="M860 617 Q918 639 946 666"/>
<path d="M837 680 Q884 714 908 749"/>
</g>

<!-- tiny residual yolk sac -->
<ellipse cx="408" cy="735" rx="18" ry="17" fill="#ffcf72" stroke="#ffe5a8" stroke-width="4"/>

<!-- umbilical cord -->
<path d="M651 789 C690 801 716 819 738 843 C763 872 787 897 823 911"
fill="none" stroke="url(#cord)" stroke-width="22" stroke-linecap="round"/>
<path d="M651 787 C689 799 714 817 736 841 C761 870 785 895 821 909"
fill="none" stroke="#ffe1d8" stroke-width="7" stroke-linecap="round"/>

<!-- Week 20 fetus: more mature fetal proportions, rounded head, longer limbs -->
<g>
<ellipse cx="588" cy="565" rx="286" ry="355" fill="#ffb5a8" opacity=".12" filter="url(#soft)"/>

<!-- torso -->
<path d="M555 443 C520 465 500 516 502 575 C504 632 519 681 542 729
C565 776 578 820 601 856 C629 900 689 916 742 891
C791 868 812 822 801 770 C789 716 760 669 745 621
C728 564 723 507 688 465 C652 426 591 420 555 443Z"
fill="url(#skin)" stroke="#ffe6dd" stroke-width="10"/>

<!-- head, proportionally smaller than earlier weeks -->
<path d="M510 250 C459 250 416 280 397 328 C375 383 388 441 426 475
C460 505 505 511 539 488 C576 462 594 408 584 353
C575 302 548 258 510 250Z"
fill="#ffebe1" stroke="#ffe6dd" stroke-width="8"/>

<!-- neck -->
<path d="M520 472 Q541 493 569 506" fill="none" stroke="#e98d7e" stroke-width="24" stroke-linecap="round"/>

<!-- ear -->
<ellipse cx="549" cy="395" rx="17" ry="25" fill="#d96d63"/>
<path d="M546 385 Q560 397 546 412" fill="none" stroke="#ffd3c8" stroke-width="6" stroke-linecap="round"/>

<!-- facial profile -->
<path d="M417 314 Q443 278 485 272 Q528 270 554 301
Q575 326 573 355 L588 371 L572 389 Q569 427 535 455"
fill="none" stroke="#d35f56" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="510" cy="330" r="13" fill="#691317"/>
<circle cx="515" cy="325" r="5" fill="#fff"/>
<path d="M516 407 Q533 418 548 408" fill="none" stroke="#d45f57" stroke-width="7" stroke-linecap="round"/>
<path d="M432 430 Q468 474 522 462" fill="none" stroke="#e17a6f" stroke-width="8" opacity=".72"/>

<!-- chest and heart -->
<path d="M594 512 C579 491 553 505 559 532 C565 557 588 576 606 589
C623 573 648 552 643 527 C638 504 610 499 594 512Z" fill="#d34e4b"/>
<path d="M606 528 Q619 539 624 553" fill="none" stroke="#f18a80" stroke-width="7" stroke-linecap="round"/>

<!-- arm toward face -->
<path d="M579 547 Q552 542 530 519 Q514 498 511 474"
fill="none" stroke="#e58b7d" stroke-width="24" stroke-linecap="round"/>
<path d="M511 474 l-16 -15 M511 474 l-4 -21 M511 474 l7 -20 M511 474 l15 -14"
fill="none" stroke="#d26159" stroke-width="7" stroke-linecap="round"/>

<!-- opposite arm -->
<path d="M673 558 Q711 568 735 596 Q754 620 757 650"
fill="none" stroke="#e58b7d" stroke-width="25" stroke-linecap="round"/>
<path d="M757 650 l17 15 M757 650 l8 21 M757 650 l-2 21 M757 650 l-15 17"
fill="none" stroke="#d26159" stroke-width="7" stroke-linecap="round"/>

<!-- longer bent legs -->
<path d="M599 729 Q570 749 557 779 Q547 805 566 827 Q583 846 610 858"
fill="none" stroke="#e38a7c" stroke-width="30" stroke-linecap="round"/>
<path d="M667 728 Q696 749 709 779 Q720 805 707 828 Q695 846 675 858"
fill="none" stroke="#e38a7c" stroke-width="30" stroke-linecap="round"/>

<!-- feet and toes -->
<path d="M610 858 Q627 867 645 858 M675 858 Q658 867 642 861"
fill="none" stroke="#d26159" stroke-width="10" stroke-linecap="round"/>
<path d="M623 861 l10 14 M632 859 l11 10 M616 862 l5 14
M662 864 l-10 13 M654 862 l-11 9 M669 862 l-5 14"
