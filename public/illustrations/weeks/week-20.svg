<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
  <radialGradient id="uterus"><stop stop-color="#ffdeda"/><stop offset=".72" stop-color="#ffaaa1"/><stop offset="1" stop-color="#f57c74"/></radialGradient>
  <radialGradient id="cavity"><stop stop-color="#aa2b2e"/><stop offset=".62" stop-color="#80171b"/><stop offset="1" stop-color="#541014"/></radialGradient>
  <radialGradient id="sac"><stop stop-color="#fffaf7"/><stop offset=".7" stop-color="#ffe0d8"/><stop offset="1" stop-color="#ef998c"/></radialGradient>
  <linearGradient id="placenta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ef756b"/><stop offset="1" stop-color="#be4240"/></linearGradient>
  <radialGradient id="skin" cx="34%" cy="22%"><stop stop-color="#fff7ef"/><stop offset=".45" stop-color="#ffd3c3"/><stop offset="1" stop-color="#d36559"/></radialGradient>
  <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffd9ce"/><stop offset=".5" stop-color="#df776b"/><stop offset="1" stop-color="#f0a092"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

<rect width="1200" height="1200" fill="#fff"/>
<ellipse cx="600" cy="1065" rx="350" ry="30" fill="#d9847b" opacity=".18" filter="url(#blur)"/>

<!-- uterus -->
<circle cx="600" cy="600" r="475" fill="url(#uterus)"/>
<circle cx="600" cy="600" r="446" fill="#ff7169"/>
<circle cx="600" cy="600" r="424" fill="#ffaaa1"/>
<circle cx="600" cy="600" r="405" fill="url(#cavity)"/>
<circle cx="600" cy="600" r="379" fill="#671316" opacity=".78"/>

<!-- decidual/endometrial tissue -->
