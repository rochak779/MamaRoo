<!-- abdomen -->
<path d="M602 590 Q663 609 701 660 Q724 692 735 738"
fill="none" stroke="#d96a60" stroke-width="13" opacity=".65"/>

<!-- small hand/finger definition -->
<path d="M530 519 Q537 510 544 504 M527 515 Q533 505 538 498"
fill="none" stroke="#d26159" stroke-width="5" stroke-linecap="round"/>

<!-- highlights -->
<path d="M416 318 Q443 280 484 269" fill="none" stroke="#fffaf6" stroke-width="13" stroke-linecap="round" opacity=".85"/>
<path d="M605 828 Q644 878 700 887" fill="none" stroke="#ffddd2" stroke-width="9" stroke-linecap="round" opacity=".65"/>
</g>

<!-- fluid particles -->
<g fill="#f99d92" stroke="#ffded7" stroke-width="3">
<circle cx="390" cy="307" r="8"/><circle cx="451" cy="267" r="7"/><circle cx="755" cy="283" r="8"/>
<circle cx="845" cy="355" r="8"/><circle cx="886" cy="466" r="7"/><circle cx="884" cy="596" r="8"/>
<circle cx="836" cy="760" r="7"/><circle cx="454" cy="800" r="7"/>
</g>
</svg>