<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
  <radialGradient id="uterus"><stop stop-color="#ffe5df"/><stop offset=".72" stop-color="#ffaaa0"/><stop offset="1" stop-color="#f47d75"/></radialGradient>
  <radialGradient id="cavity"><stop stop-color="#a92c30"/><stop offset=".65" stop-color="#7a171c"/><stop offset="1" stop-color="#510e13"/></radialGradient>
  <radialGradient id="sac"><stop stop-color="#fffdfa"/><stop offset=".7" stop-color="#ffe4dc"/><stop offset="1" stop-color="#ee9b91"/></radialGradient>
  <linearGradient id="placenta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ed756b"/><stop offset="1" stop-color="#b9403e"/></linearGradient>
  <radialGradient id="skin" cx="30%" cy="18%"><stop stop-color="#fff8f0"/><stop offset=".46" stop-color="#ffd4c4"/><stop offset="1" stop-color="#cf6258"/></radialGradient>
