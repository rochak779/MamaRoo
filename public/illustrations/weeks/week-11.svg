<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
 <radialGradient id="outer"><stop stop-color="#ffdcd5"/><stop offset="1" stop-color="#ff9d94"/></radialGradient>
 <radialGradient id="cavity"><stop stop-color="#ad272a"/><stop offset=".65" stop-color="#831619"/><stop offset="1" stop-color="#5b1014"/></radialGradient>
 <radialGradient id="sac"><stop stop-color="#fff8f3"/><stop offset=".55" stop-color="#ffded5"/><stop offset="1" stop-color="#ef988b"/></radialGradient>
 <radialGradient id="fetus"><stop stop-color="#fff5ec"/><stop offset=".42" stop-color="#ffcbbb"/><stop offset="1" stop-color="#dc665c"/></radialGradient>
 <radialGradient id="yolk"><stop stop-color="#fff1bd"/><stop offset=".55" stop-color="#ffca6c"/><stop offset="1" stop-color="#e79a42"/></radialGradient>
 <linearGradient id="tissue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb2a7"/><stop offset="1" stop-color="#d85650"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1200" height="1200" fill="#fff"/>
<ellipse cx="600" cy="1080" rx="320" ry="28" fill="#e8aaa3" opacity=".24" filter="url(#blur)"/>

<!-- uterus -->
<circle cx="600" cy="600" r="500" fill="url(#outer)"/>
<circle cx="600" cy="600" r="468" fill="#ff756d"/>
<circle cx="600" cy="600" r="446" fill="#ffb4ab"/>
<circle cx="600" cy="600" r="426" fill="url(#cavity)"/>
<circle cx="600" cy="600" r="399" fill="#701316" opacity=".72"/>

<!-- decidual lining -->
<path d="M100 315 C205 235 340 255 415 365 C485 470 460 650 535 810
 C600 940 755 960 890 875 C980 820 1040 740 1100 640 L1100 1100 L100 1100Z"
 fill="url(#tissue)"/>
<path d="M120 315 C220 255 330 280 400 380 C475 485 465 650 540 805
 C605 915 750 940 885 865 C975 815 1035 735 1080 635"
 fill="none" stroke="#ffbbae" stroke-width="28" opacity=".72"/>

<!-- tissue cells -->
<g fill="#ed7369" stroke="#d65a53" stroke-width="4">
<circle cx="165" cy="350" r="39"/><circle cx="225" cy="305" r="42"/><circle cx="290" cy="320" r="40"/>
<circle cx="345" cy="370" r="42"/><circle cx="380" cy="430" r="40"/><circle cx="395" cy="495" r="41"/>
<circle cx="395" cy="560" r="40"/><circle cx="405" cy="625" r="41"/><circle cx="438" cy="690" r="42"/>
<circle cx="485" cy="755" r="43"/><circle cx="545" cy="805" r="44"/><circle cx="615" cy="835" r="44"/>
<circle cx="690" cy="845" r="43"/><circle cx="765" cy="830" r="42"/><circle cx="835" cy="800" r="41"/>
<circle cx="900" cy="760" r="40"/><circle cx="960" cy="705" r="39"/>
<circle cx="205" cy="405" r="40"/><circle cx="270" cy="385" r="41"/><circle cx="330" cy="435" r="40"/>
<circle cx="350" cy="505" r="40"/><circle cx="350" cy="575" r="40"/><circle cx="375" cy="645" r="41"/>
<circle cx="420" cy="715" r="42"/><circle cx="475" cy="780" r="42"/><circle cx="545" cy="830" r="42"/>
<circle cx="625" cy="865" r="43"/><circle cx="705" cy="865" r="42"/><circle cx="785" cy="845" r="41"/>
</g>

<!-- gestational sac -->
<path d="M395 260 C500 170 710 170 835 275 C945 365 965 515 910 670
 C865 805 750 900 605 905 C460 910 350 805 325 650
 C300 495 330 350 395 260Z"
 fill="url(#sac)" stroke="#ffe4db" stroke-width="12"/>
<ellipse cx="620" cy="555" rx="270" ry="330" fill="#fffaf7" opacity=".28"/>

<!-- yolk sac -->
<ellipse cx="430" cy="715" rx="57" ry="52" fill="url(#yolk)" stroke="#ffe4ad" stroke-width="7"/>
<ellipse cx="415" cy="698" rx="17" ry="12" fill="#fff5cf" opacity=".7"/>

<!-- placenta -->
<path d="M780 255 C875 310 935 420 940 540 C945 650 900 745 835 810
 C800 750 770 695 740 630 C710 570 720 390 780 255Z" fill="#e4665e" opacity=".92"/>
<g fill="none" stroke="#ffaaa0" stroke-width="18" stroke-linecap="round">
<path d="M820 325 Q885 275 915 235"/><path d="M855 380 Q920 340 955 300"/>
<path d="M875 440 Q940 415 970 380"/><path d="M885 505 Q950 505 980 475"/>
<path d="M880 580 Q940 595 970 585"/><path d="M855 650 Q905 685 935 695"/>
<path d="M825 720 Q865 755 885 780"/>
</g>

<!-- umbilical cord -->
<path d="M650 760 C700 785 735 815 765 850 C795 880 820 900 845 910"
 fill="none" stroke="#f09a8b" stroke-width="22" stroke-linecap="round"/>
<path d="M650 757 C697 782 732 812 762 847 C792 877 817 897 842 907"
 fill="none" stroke="#ffd7cc" stroke-width="7" stroke-linecap="round"/>

<!-- WEEK 11 fetus: more upright, proportionally larger head, separated limbs, distinct hands/feet -->
<g>
 <ellipse cx="610" cy="550" rx="245" ry="315" fill="#ffb9ad" opacity=".14" filter="url(#soft)"/>

 <!-- torso and hips -->
 <path d="M605 435 C555 450 530 500 535 560
 C540 625 565 680 580 730
 C592 770 590 820 615 855
 C645 895 710 900 750 865
 C790 830 800 775 790 720
 C780 660 755 610 750 555
 C745 505 720 465 675 440
 C650 427 625 428 605 435Z"
 fill="url(#fetus)" stroke="#ffe3d8" stroke-width="10"/>

 <!-- head -->
 <path d="M535 300 C475 305 430 345 420 400
 C410 455 432 505 475 525
 C520 546 565 520 580 475
 C595 430 588 365 560 325
 C553 314 544 305 535 300Z"
 fill="#ffebe0" stroke="#ffe5db" stroke-width="8"/>

 <!-- face -->
 <path d="M455 350 Q485 315 525 315 Q565 325 578 360
 Q590 395 578 425 Q565 455 535 475"
 fill="none" stroke="#de645c" stroke-width="12" stroke-linecap="round"/>
 <circle cx="500" cy="405" r="17" fill="#701418"/>
 <circle cx="506" cy="399" r="5" fill="#fff"/>
 <path d="M525 438 Q545 449 562 438" fill="none" stroke="#d65b54" stroke-width="7" stroke-linecap="round"/>

 <!-- neck -->
 <path d="M555 480 Q580 500 605 515" fill="none" stroke="#ee9789" stroke-width="23" stroke-linecap="round"/>

 <!-- chest / heart -->
 <path d="M625 515 C608 490 578 508 587 538 C596 564 622 580 637 592
 C653 577 677 555 671 530 C666 507 640 504 625 515Z" fill="#d9534f"/>

 <!-- abdomen -->
 <path d="M620 585 Q675 620 715 690 Q735 730 740 770"
 fill="none" stroke="#df6a61" stroke-width="15" opacity=".7"/>

 <!-- arm 1 -->
 <path d="M610 555 Q575 565 550 600 Q535 620 542 642"
 fill="none" stroke="#ee9587" stroke-width="27" stroke-linecap="round"/>
 <!-- hand and fingers -->
 <path d="M542 642 l-18 18 M542 642 l-5 22 M542 642 l10 17"
 fill="none" stroke="#dc7066" stroke-width="8" stroke-linecap="round"/>

 <!-- arm 2 -->
 <path d="M700 580 Q742 595 765 630 Q780 652 774 675"
 fill="none" stroke="#ee9587" stroke-width="26" stroke-linecap="round"/>
 <path d="M774 675 l18 14 M774 675 l8 20 M774 675 l-3 20"
 fill="none" stroke="#dc7066" stroke-width="8" stroke-linecap="round"/>

 <!-- legs -->
 <path d="M620 760 Q605 805 615 850 Q620 870 635 880"
 fill="none" stroke="#ed9284" stroke-width="28" stroke-linecap="round"/>
 <path d="M690 765 Q710 810 720 850 Q725 872 738 882"
 fill="none" stroke="#ed9284" stroke-width="27" stroke-linecap="round"/>

 <!-- feet -->
 <path d="M635 880 q-18 12 -28 20 M635 880 q-3 17 -12 27 M635 880 q10 12 19 19"
 fill="none" stroke="#d96b62" stroke-width="8" stroke-linecap="round"/>
 <path d="M738 882 q-18 12 -27 20 M738 882 q-2 16 -10 26 M738 882 q10 12 18 18"
 fill="none" stroke="#d96b62" stroke-width="8" stroke-linecap="round"/>

 <!-- early fingers/toes detail -->
 <g fill="#d65e57" opacity=".6">
  <ellipse cx="676" cy="490" rx="12" ry="17"/><ellipse cx="689" cy="515" rx="12" ry="17"/>
  <ellipse cx="700" cy="540" rx="12" ry="17"/><ellipse cx="708" cy="565" rx="12" ry="17"/>
  <ellipse cx="713" cy="590" rx="12" ry="17"/>
 </g>

 <!-- highlights -->
 <path d="M445 350 Q475 310 520 305" fill="none" stroke="#fffaf5" stroke-width="14" stroke-linecap="round" opacity=".8"/>
 <path d="M610 830 Q650 875 700 875" fill="none" stroke="#ffddd2" stroke-width="9" stroke-linecap="round" opacity=".65"/>
</g>

<!-- fluid particles -->
<g fill="#f99d92" stroke="#ffded7" stroke-width="3">
<circle cx="405" cy="350" r="9"/><circle cx="475" cy="285" r="8"/><circle cx="770" cy="290" r="9"/>
<circle cx="855" cy="390" r="10"/><circle cx="895" cy="555" r="8"/><circle cx="850" cy="785" r="8"/>
<circle cx="440" cy="800" r="7"/>
</g>
</svg>