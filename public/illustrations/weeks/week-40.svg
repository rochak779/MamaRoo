<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="body" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f8d7c9"/>
      <stop offset="0.65" stop-color="#efb9aa"/>
      <stop offset="1" stop-color="#df9a91"/>
    </radialGradient>
    <radialGradient id="uterus" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#f8d9d0"/>
      <stop offset="0.72" stop-color="#efb5b0"/>
      <stop offset="1" stop-color="#d88b8d"/>
    </radialGradient>
    <radialGradient id="cavity" cx="48%" cy="42%" r="70%">
      <stop offset="0" stop-color="#9d4b55"/>
      <stop offset="0.72" stop-color="#71313d"/>
      <stop offset="1" stop-color="#55242f"/>
    </radialGradient>
    <radialGradient id="sac" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fff5ed" stop-opacity=".82"/>
      <stop offset=".65" stop-color="#f8ddd7" stop-opacity=".56"/>
      <stop offset="1" stop-color="#e7b9b9" stop-opacity=".38"/>
