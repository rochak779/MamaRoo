    <radialGradient id="skin" cx="38%" cy="25%" r="78%">
      <stop offset="0" stop-color="#ffe2d1"/>
      <stop offset=".48" stop-color="#f6c5b4"/>
      <stop offset="1" stop-color="#d99486"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70453e"/>
      <stop offset="1" stop-color="#a36a5e"/>
    </linearGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b7b0"/>
      <stop offset=".5" stop-color="#f7d0c9"/>
      <stop offset="1" stop-color="#d9878b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

