<!-- highlights -->
<path d="M415 317 Q447 276 491 268" fill="none" stroke="#fffaf6" stroke-width="13" stroke-linecap="round" opacity=".85"/>
<path d="M608 824 Q647 871 703 880" fill="none" stroke="#ffddd2" stroke-width="9" stroke-linecap="round" opacity=".65"/>
</g>

<!-- fluid particles -->
<g fill="#f99d92" stroke="#ffded7" stroke-width="3">
<circle cx="389" cy="309" r="8"/><circle cx="451" cy="267" r="7"/><circle cx="755" cy="283" r="8"/>
<circle cx="845" cy="355" r="8"/><circle cx="886" cy="466" r="7"/><circle cx="884" cy="596" r="8"/>
