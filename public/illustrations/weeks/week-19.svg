<path d="M525 468 Q547 493 575 505" fill="none" stroke="#e98d7e" stroke-width="25" stroke-linecap="round"/>

<!-- ear -->
<ellipse cx="542" cy="399" rx="17" ry="25" fill="#d96d63"/>
<path d="M539 389 Q555 400 540 416" fill="none" stroke="#ffd3c8" stroke-width="6" stroke-linecap="round"/>

