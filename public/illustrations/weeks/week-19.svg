<path d="M607 530 Q621 540 625 555" fill="none" stroke="#f18a80" stroke-width="7" stroke-linecap="round"/>

<!-- arm lifted toward face -->
<path d="M580 548 Q552 543 529 519 Q513 499 512 476"
