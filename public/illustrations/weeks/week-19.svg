<path d="M611 854 Q628 863 645 854" fill="none" stroke="#d26159" stroke-width="10" stroke-linecap="round"/>
<path d="M675 855 Q658 864 643 859" fill="none" stroke="#d26159" stroke-width="10" stroke-linecap="round"/>
