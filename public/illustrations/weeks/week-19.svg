<!-- Week 19 fetus: more elongated, distinct limbs, hands and feet -->
<g>
<ellipse cx="589" cy="566" rx="282" ry="352" fill="#ffb5a8" opacity=".12" filter="url(#soft)"/>

<!-- torso -->
<path d="M552 443 C518 466 499 518 503 576 C506 632 523 681 547 727
